<!DOCTYPE html>
<html>
<head>
  <title>Pathlight.ai Tailorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --bg-dark: #09090b;
      --bg-card: rgba(24, 24, 27, 0.65);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --success: #10b981;
      --accent: #8b5cf6;
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      padding: 0;
      margin: 0;
      width: 340px;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
      color: var(--text-main); 
      overflow-x: hidden;
    }

    .header {
      padding: 24px 20px 20px;
      text-align: center;
      position: relative;
    }
    
    .logo-container {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .header h2 { 
      font-size: 20px; 
      margin: 0; 
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      margin: 6px 0 0 0;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .container {
      padding: 0 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    
    button { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, var(--primary), #4f46e5); 
      color: white; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px var(--primary-glow);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: skewX(-20deg);
    }
    
    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }
    
    button:hover::after {
      animation: shine 1.5s ease-in-out;
    }
    
    @keyframes shine {
      100% { left: 200%; }
    }
    
    button:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .hidden { display: none !important; }
    
    #status { 
      margin-top: 16px; 
      font-size: 13px; 
      color: var(--text-muted); 
      text-align: center; 
      font-weight: 500;
      line-height: 1.5;
    }
    
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    
    .spinner-ring {
      width: 48px;
      height: 48px;
      position: relative;
    }
    
    .spinner-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 48px;
      height: 48px;
      margin: 0;
      border: 3px solid transparent;
      border-radius: 50%;
      animation: spinner-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: var(--primary) transparent transparent transparent;
    }
    
    .spinner-ring div:nth-child(1) { animation-delay: -0.45s; }
    .spinner-ring div:nth-child(2) { animation-delay: -0.3s; }
    .spinner-ring div:nth-child(3) { animation-delay: -0.15s; }
    
    @keyframes spinner-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    #downloadBtn { 
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    #downloadBtn:hover { 
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    
    #dashboardBtn { 
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }
    #dashboardBtn:hover { 
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <img src="assets/pathlight_logo.png" alt="Pathlight.ai Logo">
    </div>
    <h2>Pathlight.ai</h2>
    <p>AI Resume Tailoring Engine</p>
  </div>
  
  <div class="container">
    <div class="glass-card">
      <div id="main-actions">
        <button id="scrapeBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3L11 9L17 11L11 13L9 19L7 13L1 11L7 9L9 3Z"></path>
          </svg>
          Tailor for this Job
        </button>
      </div>
      
      <div id="loading-container" class="hidden">
        <div class="spinner-ring">
          <div></div><div></div><div></div><div></div>
        </div>
        <div id="status" class="pulse">Extracting Job Details...</div>
      </div>

      <div id="result-actions" class="hidden">
        <button id="downloadBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Download Tailored PDF
        </button>
        <button id="dashboardBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          View in Dashboard
        </button>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
