<!DOCTYPE html>
<html>
<head>
  <title>Pathlight.ai Tailorer</title>
  <style>
    body { font-family: 'Inter', sans-serif; padding: 15px; width: 300px; background-color: #f9fafb; color: #111827; }
    h2 { font-size: 16px; margin-top: 0; color: #2563eb; }
    button { width: 100%; padding: 10px; margin-top: 10px; background-color: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background-color: #1d4ed8; }
    .auto-apply { background-color: #10b981; }
    .auto-apply:hover { background-color: #059669; }
    .hidden { display: none !important; }
    #status { margin-top: 10px; font-size: 12px; color: #4b5563; text-align: center; }
    
    .spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    #result-actions {
      margin-top: 15px;
    }
    #downloadBtn { background-color: #f59e0b; color: white; }
    #downloadBtn:hover { background-color: #d97706; }
    #dashboardBtn { background-color: #111827; color: white; }
    #dashboardBtn:hover { background-color: #000; }
  </style>
</head>
<body>
  <h2>Pathlight.ai</h2>
  
  <div id="main-actions">
    <button id="scrapeBtn">Tailor Resume for this Job</button>
    <button id="applyBtn" class="auto-apply">Start Auto Apply</button>
  </div>
  
  <div id="loading-container" class="hidden">
    <div class="spinner"></div>
    <div id="status">Sending to Pathlight.ai...</div>
  </div>

  <div id="result-actions" class="hidden">
    <button id="downloadBtn">Download PDF</button>
    <button id="dashboardBtn">View in Dashboard</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
